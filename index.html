<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Danish Master App - Level Progression</title>
    <style>
        :root {
            --bg-color: #e8f4fd; 
            --card-bg: #ffffff;
            --text-main: #333333;
            --btn-mint: #b5ead7;
            --btn-mint-hover: #9cd5c1;
            --btn-pink: #ffdac1;
            --btn-pink-hover: #ffcba4;
            --btn-purple: #e2d9f3;
            --btn-purple-hover: #d1c4e9;
            --btn-blue: #a3c2fa;
            --btn-blue-hover: #8babeb;
            --correct: #c7ceea; 
            --incorrect: #ffb7b2; 
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh; margin: 0; padding: 15px;
        }

        .screen {
            display: none; background-color: var(--card-bg); padding: 30px 20px;
            border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%; max-width: 650px; text-align: center; margin-top: 10px;
        }
        .screen.active { display: block; }

        h1 { font-size: 1.5rem; margin-bottom: 10px; color: #555; }
        
        /* Accordion Menu Styles */
        .accordion {
            background-color: #f8f9fa; color: #444; cursor: pointer; padding: 18px;
            width: 100%; text-align: left; border: 2px solid #eee; outline: none;
            transition: 0.2s; font-size: 1.1rem; font-weight: bold; border-radius: 12px;
            margin-top: 15px; display: flex; justify-content: space-between; align-items: center;
        }
        .active-acc, .accordion:hover { background-color: #eee; border-color: #ddd; }
        .accordion:after { content: '\002B'; font-size: 1.5rem; font-weight: bold; }
        .active-acc:after { content: "\2212"; }
        
        .panel {
            padding: 0 5px; background-color: white; overflow: hidden;
            display: none; border-radius: 0 0 12px 12px; margin-bottom: 10px;
        }

        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin: 15px 0; }
        
        @media (min-width: 480px) { .menu-grid { grid-template-columns: 1fr 1fr; } }

        .menu-btn {
            background-color: var(--btn-mint); border: none; padding: 18px;
            border-radius: 12px; font-size: 1.1rem; cursor: pointer; font-weight: bold;
            color: #444; transition: transform 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .menu-btn:hover { transform: translateY(-2px); filter: brightness(0.95); }

        .nav-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #eee;
        }
        .back-btn {
            background-color: #eee; border: none; padding: 8px 15px; border-radius: 10px;
            font-size: 0.9rem; cursor: pointer; font-weight: bold; color: #555;
        }
        .score-board { font-size: 0.95rem; color: #888; font-weight: bold; }

        .question-box {
            margin-bottom: 25px; padding: 25px 15px; border: 2px dashed var(--btn-pink);
            border-radius: 15px; background-color: #fafafa; position: relative;
        }

        .dict-link {
            color: inherit; text-decoration: none; border-bottom: 3px dotted var(--btn-mint-hover);
            transition: 0.2s; cursor: pointer;
        }
        .dict-link:hover { background-color: var(--btn-mint); color: #000; border-radius: 5px; }

        .speak-btn {
            background-color: var(--btn-pink); border: none; padding: 10px 20px;
            border-radius: 20px; font-size: 0.95rem; cursor: pointer; font-weight: bold;
            color: #444; display: inline-flex; align-items: center; gap: 8px; margin-top: 15px;
        }

        .audio-only-icon { font-size: 4rem; display: block; margin-bottom: 10px; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .options-grid.full-width { grid-template-columns: 1fr; }

        button.option-btn {
            background-color: var(--btn-mint); border: none; padding: 18px 15px;
            border-radius: 12px; font-size: 1.1rem; cursor: pointer; font-weight: 600;
            color: #444; transition: all 0.2s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            word-wrap: break-word;
        }
        button.option-btn:disabled { cursor: not-allowed; transform: none; opacity: 0.9; }
        .correct-btn { background-color: var(--correct) !important; color: #000 !important; border: 2px solid #4CAF50 !important; }
        .incorrect-btn { background-color: var(--incorrect) !important; color: #000 !important; border: 2px solid #F44336 !important; }

        .feedback-text { min-height: 24px; font-weight: bold; margin-bottom: 15px; font-size: 1.1rem; }

        .next-btn {
            background-color: var(--btn-purple); border: none; padding: 15px 30px;
            border-radius: 25px; font-size: 1.1rem; cursor: pointer; font-weight: bold;
            color: #444; display: none; margin: 0 auto; width: 100%; max-width: 300px;
        }
        .next-btn:hover { background-color: var(--btn-purple-hover); }

        .explanation-box {
            display: none; background-color: #fff8e1; border-left: 5px solid #ffc107;
            padding: 15px; border-radius: 0 10px 10px 0; margin-bottom: 20px;
            text-align: left; font-size: 0.95rem; line-height: 1.4; color: #444;
        }

        .q-display-large { font-size: 2.5rem; font-weight: bold; color: #222; }
        .q-display-medium { font-size: 1.3rem; font-weight: bold; color: #222; line-height: 1.4; }
        .q-english { font-size: 0.95rem; color: #666; font-style: italic; margin-top: 8px; }
        .q-digital { font-size: 2rem; font-weight: bold; font-family: 'Courier New', monospace; background-color: #eee; display: inline-block; padding: 5px 15px; border-radius: 10px; margin-top: 10px; }
    </style>
</head>
<body>

<!-- MAIN MENU -->
<div id="screen-menu" class="screen active">
    <h1>I ❤️ DK - Module 1 Master</h1>
    <p style="color: #666; margin-bottom: 15px;">Select your difficulty level.</p>
    
    <button class="accordion">Level 1: Reading & Audio</button>
    <div class="panel">
        <div class="menu-grid">
            <button class="menu-btn" onclick="startGame('words', 1)">Question Words</button>
            <button class="menu-btn" onclick="startGame('numbers', 1)">Numbers & Math</button>
            <button class="menu-btn" onclick="startGame('articles', 1)">En eller Et?</button>
            <button class="menu-btn" style="background-color: var(--btn-pink);" onclick="startGame('time', 1)">Hvad er klokken?</button>
            <!-- NEW ROUTINE BUTTON LEVEL 1 -->
            <button class="menu-btn" style="background-color: var(--btn-blue); grid-column: 1 / -1;" onclick="startGame('routine', 1)">Daily Routine & Work</button>
        </div>
    </div>

    <button class="accordion">Level 2: Audio Only (No Text)</button>
    <div class="panel">
        <div class="menu-grid">
            <button class="menu-btn" onclick="startGame('words', 2)">Question Words 🔊</button>
            <button class="menu-btn" onclick="startGame('numbers', 2)">Numbers & Math 🔊</button>
            <button class="menu-btn" onclick="startGame('articles', 2)">En eller Et? 🔊</button>
            <button class="menu-btn" style="background-color: var(--btn-pink);" onclick="startGame('time', 2)">Hvad er klokken? 🔊</button>
            <!-- NEW ROUTINE BUTTON LEVEL 2 -->
            <button class="menu-btn" style="background-color: var(--btn-blue); grid-column: 1 / -1;" onclick="startGame('routine', 2)">Daily Routine & Work 🔊</button>
        </div>
    </div>

    <button class="accordion">Level 3: Ultimate Q&A Mastery</button>
    <div class="panel">
        <div class="menu-grid" style="grid-template-columns: 1fr;">
            <button class="menu-btn" style="background-color: var(--btn-purple);" onclick="startGame('mixed', 3)">
                Mixed Audio Sentences 🔊<br><span style="font-size: 0.9rem; font-weight: normal;">Full conversational Q&A pool</span>
            </button>
        </div>
    </div>
</div>

<!-- SHARED GAME TEMPLATE -->
<div id="screen-game" class="screen">
    <div class="nav-header">
        <button class="back-btn" onclick="showMenu()">← Menu</button>
        <div class="score-board"><span id="game-counter"></span> | Score: <span id="game-score"></span></div>
    </div>
    <div class="question-box">
        <span id="audio-icon" class="audio-only-icon" style="display:none;">🎧</span>
        <div class="q-display-medium" id="game-danish"></div>
        <div class="q-english" id="game-english"></div>
        <div class="q-digital" id="game-digital" style="display:none;"></div>
        <button class="speak-btn" id="game-speak" onclick="speakCurrent()">🔊 Lyt</button>
    </div>
    <div class="options-grid" id="game-options"></div>
    <div class="feedback-text" id="game-feedback"></div>
    <div class="explanation-box" id="game-explanation"></div>
    <button class="next-btn" id="game-next" onclick="nextRound()">Next</button>
</div>

<script>
    // --- ACCORDION LOGIC ---
    document.querySelectorAll('.accordion').forEach(acc => {
        acc.addEventListener("click", function() {
            this.classList.toggle("active-acc");
            let panel = this.nextElementSibling;
            panel.style.display = panel.style.display === "block" ? "none" : "block";
        });
    });

    // --- GLOBAL AUDIO & UTILS ---
    let danishVoice = null;
    let currentLevel = 1;
    let currentGame = '';
    
    function loadVoices() {
        const voices = window.speechSynthesis.getVoices();
        danishVoice = voices.find(v => v.lang.includes('da') || v.lang === 'da-DK' || v.name.includes('Danish'));
    }
    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();
    }

    function playAudio(text, rate = 0.85) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'da-DK';
        if (danishVoice) utterance.voice = danishVoice;
        utterance.rate = rate;
        window.speechSynthesis.speak(utterance);
    }

    function shuffle(array) {
        let curId = array.length;
        while (0 !== curId) {
            let randId = Math.floor(Math.random() * curId);
            curId -= 1;
            let tmp = array[curId];
            array[curId] = array[randId];
            array[randId] = tmp;
        }
        return array;
    }

    function linkify(sentence) {
        return sentence.split(' ').map(word => {
            if (word.includes("___") || word.includes("<") || word.includes("🎧")) return word;
            const cleanWord = word.replace(/[^\wæøåÆØÅ-]/g, '').toLowerCase();
            if(cleanWord.length > 0) return `<a href="https://ordnet.dk/ddo/ordbog?query=${cleanWord}" target="_blank" class="dict-link">${word}</a>`;
            return word;
        }).join(' ');
    }
    function linkifyRaw(sentence) {
        return sentence.split(' ').map(word => {
            const cleanWord = word.replace(/[^\wæøåÆØÅ-]/g, '').toLowerCase();
            if(cleanWord.length > 0) return `<span onclick="window.open('https://ordnet.dk/ddo/ordbog?query=${cleanWord}', '_blank'); event.stopPropagation();" class="dict-link">${word}</span>`;
            return word;
        }).join(' ');
    }

    function showMenu() {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-menu').classList.add('active');
        window.speechSynthesis.cancel();
    }

    function startGame(gameId, level) {
        if ('speechSynthesis' in window) playAudio(""); // Unlock audio
        currentLevel = level;
        currentGame = gameId;
        
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-game').classList.add('active');
        
        // Reset UI defaults
        document.getElementById('game-digital').style.display = 'none';
        document.getElementById('audio-icon').style.display = 'none';
        document.getElementById('game-english').style.display = 'block';
        document.getElementById('game-options').className = 'options-grid';
        
        if(gameId === 'words') initWords();
        if(gameId === 'numbers') initNumbers();
        if(gameId === 'articles') initArticles();
        if(gameId === 'time') initTime();
        if(gameId === 'routine') initRoutine(); // Hooked up Daily Routine
        if(gameId === 'mixed') initMixed();
    }
    
    const TOTAL_ROUNDS = 50;

    // --- GAME DATA ---
    const allQWords = ["Hvad", "Hvem", "Hvorfor", "Hvordan", "Hvis", "Hvilken(t)", "Hvor", "Hvor + adjective", "Hvornår"];
    
    const wordsDataList = [
        { d: "___ hedder du?", e: "(What is your name?)", a: "Hvad" },
        { d: "___ kommer du fra?", e: "(Where do you come from?)", a: "Hvor" },
        { d: "___ arbejder i Billund?", e: "(Who works in Billund?)", a: "Hvem" },
        { d: "___ udtaler man 'halvtreds'?", e: "(How do you pronounce 'halvtreds'?)", a: "Hvordan" },
        { d: "___ lærer du dansk?", e: "(Why are you learning Danish?)", a: "Hvorfor" },
        { d: "___ bærbar computer bruger du?", e: "(Which laptop do you use?)", a: "Hvilken(t)" },
        { d: "___ kaffemaskine er det?", e: "(Whose coffee machine is it?)", a: "Hvis" },
        { d: "___ mange timer sover du?", e: "(How many hours do you sleep?)", a: "Hvor + adjective" },
        { d: "___ kører bussen?", e: "(When does the bus leave?)", a: "Hvornår" },
        { d: "___ koster en returbillet?", e: "(What does a return ticket cost?)", a: "Hvad" }
    ];

    const artDataList = [
        { w: "mand", a: "en", t: "man", tip: "Living things are almost always 'en'." },
        { w: "barn", a: "et", t: "child", tip: "Exception! 'barn' is always 'et'." },
        { w: "hus", a: "et", t: "house", tip: "Many physical buildings take 'et'." },
        { w: "cykel", a: "en", t: "bicycle", tip: "Everyday transport usually takes 'en'." },
        { w: "tog", a: "et", t: "train", tip: "Exception! A train is always 'et tog'." },
        { w: "job", a: "et", t: "job", tip: "Common survival word requiring memorization." },
        { w: "computer", a: "en", t: "computer", tip: "English tech loanwords usually take 'en'." },
        { w: "kaffe", a: "en", t: "coffee", tip: "Drinks and liquids usually take 'en'." },
        { w: "problem", a: "et", t: "problem", tip: "Abstract Greek/Latin roots often take 'et'." },
        { w: "uddannelse", a: "en", t: "education", tip: "Words ending in '-else' are almost always 'en'." }
    ];

    // NEW POOL: Dedicated Routine and Work questions for Level 1 & 2
    const routineDataList = [
        { d: "Hvad tid står du op?", e: "(What time do you get up?)", a: "Jeg står op klokken seks." },
        { d: "Hvad tid går du i seng?", e: "(What time do you go to bed?)", a: "Jeg går i seng ved ellevetiden." },
        { d: "Hvad tid begynder du at arbejde?", e: "(What time do you start work?)", a: "Det varierer meget." },
        { d: "Hvad tid får du fri?", e: "(What time do you finish work?)", a: "Jeg får fri klokken fire." },
        { d: "Hvad tid spiser du morgenmad?", e: "(What time do you eat breakfast?)", a: "Jeg spiser morgenmad klokken syv." },
        { d: "Hvad tid møder du om morgenen?", e: "(What time do you show up in the morning?)", a: "Jeg møder normalt klokken ni." },
        { d: "Hvad tid har du frokostpause?", e: "(What time is your lunch break?)", a: "Jeg har frokostpause klokken tolv." },
        { d: "Hvad tid laver du aftensmad?", e: "(What time do you make dinner?)", a: "Jeg laver aftensmad klokken seks." },
        { d: "Hvad tid spiser du aftensmad?", e: "(What time do you eat dinner?)", a: "Vi spiser aftensmad halv syv." },
        { d: "Hvad tid skal du af sted om morgenen?", e: "(What time do you have to leave in the morning?)", a: "Det kommer an på, hvad tid jeg skal møde." }
    ];

    const mixedDataList = [
        { q: "Hvad er klokken?", a: "Den er halv et." },
        { q: "Hvornår kører toget?", a: "Det kører kvart i ti." },
        { q: "Hvad tid kommer der Nyhederne på TV2?", a: "Klokken ti om aftenen." },
        { q: "Hvad betyder 'vist'?", a: "Det betyder 'probably'." },
        { q: "Hvad betyder 'snart'?", a: "Det betyder 'soon'." },
        { q: "Hvad betyder 'næsten'?", a: "Det betyder 'almost'." },
        { q: "Hvor arbejder du?", a: "Jeg arbejder i Billund." },
        { q: "Hvor meget koster kaffen?", a: "Den koster femogtyve kroner." },
        { q: "Hvem er din chef?", a: "Det er min chef." },
        { q: "Hvor kommer du fra?", a: "Jeg kommer fra Canada." },
        { q: "Hvilken computer bruger du?", a: "Jeg bruger en Asus ROG." },
        { q: "Hvorfor lærer du dansk?", a: "Fordi jeg bor i Danmark." },
        { q: "Hvad laver du i weekenden?", a: "Det kommer an på, hvad jeg skal." },
        { q: "Hvordan kommer du på arbejde?", a: "Nogle gange tager jeg bussen." },
        // Mapping the routine answers over to the mixed mode as well
        ...routineDataList.map(r => ({ q: r.d, a: r.a })) 
    ];

    // --- GAME ENGINE ---
    let gIdx = 0, gScore = 0, gData = [], gAns = false, curObj = null;

    function initWords() { gData = shuffle([...wordsDataList]); resetEngine(); }
    function initNumbers() { resetEngine(); } // Dynamic
    function initArticles() { gData = shuffle([...artDataList]); resetEngine(); }
    function initTime() { resetEngine(); } // Dynamic
    function initRoutine() { gData = shuffle([...routineDataList]); resetEngine(); document.getElementById('game-options').classList.add('full-width'); }
    function initMixed() { gData = shuffle([...mixedDataList]); resetEngine(); document.getElementById('game-options').classList.add('full-width'); }

    function resetEngine() {
        gIdx = 0; gScore = 0;
        loadNextRound();
    }

    function nextRound() {
        if(++gIdx < TOTAL_ROUNDS) loadNextRound();
        else {
            document.getElementById('game-danish').innerHTML = "Fremragende klaret!";
            document.getElementById('game-options').innerHTML = "";
            document.getElementById('game-feedback').innerText = `Slut! Score: ${gScore} / ${TOTAL_ROUNDS}`;
            document.getElementById('game-explanation').style.display = "none";
            document.getElementById('game-next').style.display = "none";
            document.getElementById('audio-icon').style.display = 'none';
        }
    }

    function loadNextRound() {
        gAns = false;
        document.getElementById('game-feedback').innerText = "";
        document.getElementById('game-explanation').style.display = "none";
        document.getElementById('game-next').style.display = "none";
        document.getElementById('game-options').innerHTML = "";
        document.getElementById('game-counter').innerText = `${gIdx + 1}/${TOTAL_ROUNDS}`;
        document.getElementById('game-score').innerText = gScore;

        if (currentGame === 'words') setupWords();
        if (currentGame === 'numbers') setupNumbers();
        if (currentGame === 'articles') setupArticles();
        if (currentGame === 'time') setupTime();
        if (currentGame === 'routine') setupRoutine();
        if (currentGame === 'mixed') setupMixed();
    }

    // --- SPECIFIC SETUPS ---
    function setupWords() {
        let q = gData[gIdx % gData.length];
        curObj = { ...q, full: q.d.replace("___", q.a === "Hvor + adjective" ? "Hvor" : q.a) };
        
        if(currentLevel >= 2) {
            document.getElementById('game-danish').innerHTML = "Lyt til sætningen";
            document.getElementById('audio-icon').style.display = 'block';
            document.getElementById('game-english').style.display = 'none';
            setTimeout(speakCurrent, 300);
        } else {
            document.getElementById('game-danish').innerHTML = linkify(q.d);
            document.getElementById('game-english').innerText = q.e;
        }

        let opts = [q.a, ...shuffle(allQWords.filter(w => w !== q.a)).slice(0,3)];
        renderOptions(shuffle(opts), q.a);
    }

    function setupNumbers() {
        let tNum = Math.floor(Math.random() * 99) + 1;
        let tWord = getNumWord(tNum);
        curObj = { num: tNum, word: tWord, tip: getNumTip(tNum) };
        
        if (currentLevel >= 2) {
            document.getElementById('game-danish').innerHTML = "Lyt til tallet";
            document.getElementById('audio-icon').style.display = 'block';
            setTimeout(speakCurrent, 300);
        } else {
            document.getElementById('game-danish').innerHTML = tNum;
            document.getElementById('game-danish').classList.add('q-display-large');
        }

        let opts = [tWord];
        while(opts.length < 4) {
            let wNum = tNum + ((Math.floor(Math.random()*5)+1)*10 * (Math.random()>0.5?1:-1));
            if(wNum<1) wNum+=40; if(wNum>100) wNum-=40;
            if(Math.random()>0.7) wNum = Math.floor(tNum/10)*10 + (Math.floor(Math.random()*9)+1);
            let wStr = getNumWord(wNum);
            if(!opts.includes(wStr)) opts.push(wStr);
        }
        renderOptions(shuffle(opts), tWord);
    }

    function setupArticles() {
        let q = gData[gIdx % gData.length];
        curObj = q;
        
        if (currentLevel >= 2) {
            document.getElementById('game-danish').innerHTML = "Lyt til ordet";
            document.getElementById('audio-icon').style.display = 'block';
            setTimeout(speakCurrent, 300);
        } else {
            document.getElementById('game-danish').innerHTML = `___ ${linkify(q.w)}`;
            document.getElementById('game-danish').classList.add('q-display-large');
        }

        let opts = ["en", "et"];
        document.getElementById('game-options').classList.add('full-width');
        renderOptions(opts, q.a, true); 
    }

    function setupTime() {
        document.getElementById('game-options').classList.add('full-width');
        let h24 = Math.floor(Math.random() * 24);
        let m = [0, 15, 30, 45, 10, 20, 50, 55][Math.floor(Math.random() * 8)];
        let h12 = h24 % 12 || 12; 
        let nextH12 = (h12 % 12) + 1;
        let dig = `${h24.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
        
        let tod = "";
        if (h24 >= 5 && h24 < 9) tod = " om morgenen";
        else if (h24 >= 9 && h24 < 12) tod = " om formiddagen";
        else if (h24 >= 12 && h24 < 18) tod = " om eftermiddagen";
        else if (h24 >= 18 && h24 <= 23) tod = " om aftenen";
        else tod = " om natten";

        let numStrs = {1:"et", 2:"to", 3:"tre", 4:"fire", 5:"fem", 6:"seks", 7:"syv", 8:"otte", 9:"ni", 10:"ti", 11:"elleve", 12:"tolv", 20:"tyve"};
        let ans = "", tip = "";
        
        if(m===0){ ans=`klokken ${numStrs[h12]}`; tip=`On the hour: 'klokken' + number.`; }
        else if(m===15){ ans=`kvart over ${numStrs[h12]}`; tip=`'Kvart over' = 15 mins past.`; }
        else if(m===30){ ans=`halv ${numStrs[nextH12]}`; tip=`'Halv' looks forward to ${nextH12}.`; }
        else if(m===45){ ans=`kvart i ${numStrs[nextH12]}`; tip=`'Kvart i' = 15 mins to NEXT hour.`; }
        else if(m<30){ ans=`${numStrs[m]} over ${numStrs[h12]}`; tip=`'over' for past the hour.`; }
        else { ans=`${numStrs[60-m]} i ${numStrs[nextH12]}`; tip=`'i' for minutes to NEXT hour.`; }
        
        if (Math.random() > 0.4) {
            ans += tod;
            tip += ` Remember: 05-09 is morgen, 09-12 is formiddag, 12-18 is eftermiddag, 18-24 is aften, and 24-05 is nat.`;
        }
        
        const timePrompts = [
            { d: "Hvad er klokken?", e: "(What time is it?)", p: "Den er " },
            { d: "Hvad tid kommer der Nyhederne?", e: "(What time is the news on?)", p: "De kommer " },
            { d: "Hvad tid står du op?", e: "(What time do you get up?)", p: "Jeg står op " },
            { d: "Hvad tid har du fri?", e: "(What time do you get off work?)", p: "Jeg har fri " },
            { d: "Hvornår kører bussen?", e: "(When does the bus leave?)", p: "Den kører " }
        ];

        let pObj = timePrompts[Math.floor(Math.random() * timePrompts.length)];
        curObj = { qD: pObj.d, qE: pObj.e, pfx: pObj.p, ans: ans, dig: dig, tip: tip };
        let corStr = curObj.pfx + ans + ".";
        
        if (currentLevel >= 2) {
            document.getElementById('game-danish').innerHTML = "Lyt til spørgsmålet";
            document.getElementById('audio-icon').style.display = 'block';
            document.getElementById('game-english').style.display = 'none';
            setTimeout(speakCurrent, 300);
        } else {
            document.getElementById('game-danish').innerHTML = linkify(curObj.qD);
            document.getElementById('game-english').innerText = curObj.qE;
            document.getElementById('game-digital').style.display = 'inline-block';
            document.getElementById('game-digital').innerText = dig;
        }

        let opts = [corStr];
        while(opts.length < 4) {
            let fh24 = Math.floor(Math.random() * 24);
            let fm = [0, 15, 30, 45, 10][Math.floor(Math.random() * 5)];
            let fh12 = fh24 % 12 || 12; let fnH12 = (fh12 % 12) + 1;
            let fans = "";
            if(fm===0) fans=`klokken ${numStrs[fh12]}`;
            else if(fm===15) fans=`kvart over ${numStrs[fh12]}`;
            else if(fm===30) fans=`halv ${numStrs[fnH12]}`;
            else if(fm===45) fans=`kvart i ${numStrs[fnH12]}`;
            else fans=`${numStrs[fm]} over ${numStrs[fh12]}`;
            
            let ftod = [" om morgenen", " om formiddagen", " om eftermiddagen", " om aftenen", " om natten", ""][Math.floor(Math.random() * 6)];
            fans += ftod;

            let fakeStr = curObj.pfx + fans + ".";
            if(!opts.includes(fakeStr)) opts.push(fakeStr);
        }
        renderOptions(shuffle(opts), corStr);
    }

    function setupRoutine() {
        let q = gData[gIdx % gData.length];
        curObj = q;
        
        if(currentLevel >= 2) {
            document.getElementById('game-danish').innerHTML = "Lyt til spørgsmålet";
            document.getElementById('audio-icon').style.display = 'block';
            document.getElementById('game-english').style.display = 'none';
            setTimeout(speakCurrent, 300);
        } else {
            document.getElementById('game-danish').innerHTML = linkify(q.d);
            document.getElementById('game-english').innerText = q.e;
        }

        let opts = [q.a];
        // Pull wrong answers from the general mixed pool to keep things unpredictable
        while (opts.length < 4) {
            let rObj = mixedDataList[Math.floor(Math.random() * mixedDataList.length)];
            if (!opts.includes(rObj.a)) opts.push(rObj.a);
        }
        renderOptions(shuffle(opts), q.a);
    }

    function setupMixed() {
        let q = gData[gIdx % gData.length];
        curObj = q;
        
        document.getElementById('game-danish').innerHTML = "Lyt til spørgsmålet";
        document.getElementById('audio-icon').style.display = 'block';
        document.getElementById('game-english').style.display = 'none';
        setTimeout(speakCurrent, 300);

        let opts = [q.a];
        while (opts.length < 4) {
            let rObj = gData[Math.floor(Math.random() * gData.length)];
            if (!opts.includes(rObj.a)) opts.push(rObj.a);
        }
        renderOptions(shuffle(opts), q.a);
    }

    // --- SHARED LOGIC ---
    function renderOptions(opts, correctStr, isArticles = false) {
        opts.forEach(opt => {
            let b = document.createElement('button');
            b.className = 'option-btn';
            b.innerHTML = linkifyRaw(opt);
            if (isArticles && opt === 'en') b.style.backgroundColor = 'var(--btn-pink)';
            b.onclick = () => checkAnswer(b, opt, correctStr);
            document.getElementById('game-options').appendChild(b);
        });
    }

    function checkAnswer(btn, sel, cor) {
        gAns = true;
        document.querySelectorAll('#game-options button').forEach(b => b.disabled = true);
        
        if (sel === cor) { btn.classList.add('correct-btn'); gScore++; } 
        else {
            btn.classList.add('incorrect-btn');
            document.querySelectorAll('#game-options button').forEach(b => { 
                if(b.innerHTML.replace(/<[^>]*>?/gm, '') === cor) b.classList.add('correct-btn'); 
            });
        }
        document.getElementById('game-score').innerText = gScore;
        
        // Reveal Text & Tips
        if (currentLevel >= 2) {
            document.getElementById('audio-icon').style.display = 'none';
            if (currentGame === 'words') document.getElementById('game-danish').innerHTML = linkify(curObj.full);
            if (currentGame === 'numbers') { document.getElementById('game-danish').innerHTML = `${curObj.num} = ${linkify(curObj.word)}`; document.getElementById('game-danish').classList.add('q-display-large'); }
            if (currentGame === 'articles') document.getElementById('game-danish').innerHTML = `${curObj.a} ${linkify(curObj.w)}`;
            if (currentGame === 'time') { document.getElementById('game-danish').innerHTML = linkify(curObj.qD); document.getElementById('game-digital').style.display = 'inline-block'; document.getElementById('game-digital').innerText = curObj.dig; }
            if (currentGame === 'routine') document.getElementById('game-danish').innerHTML = linkify(curObj.d);
            if (currentGame === 'mixed') document.getElementById('game-danish').innerHTML = linkify(curObj.q);
        } else {
             if (currentGame === 'words') document.getElementById('game-danish').innerHTML = linkify(curObj.full);
             if (currentGame === 'numbers') document.getElementById('game-danish').innerHTML = `${curObj.num} = ${linkify(curObj.word)}`;
             if (currentGame === 'articles') document.getElementById('game-danish').innerHTML = `${curObj.a} ${linkify(curObj.w)}`;
             if (currentGame === 'routine') document.getElementById('game-danish').innerHTML = linkify(curObj.d);
        }
        
        // Explanations
        let box = document.getElementById('game-explanation');
        if (currentGame === 'words') { box.innerHTML = getQWordTip(cor); box.style.display = "block"; }
        if (currentGame === 'numbers') { box.innerHTML = curObj.tip; box.style.display = "block"; }
        if (currentGame === 'articles') { box.innerHTML = `<strong>Translation:</strong> ${curObj.t}<br><br><strong>Tip:</strong> ${curObj.tip}`; box.style.display = "block"; }
        if (currentGame === 'time') { box.innerHTML = curObj.tip; box.style.display = "block"; }
        if (currentGame === 'routine') { box.innerHTML = `<strong>Meaning:</strong> ${curObj.e}`; box.style.display = "block"; }
        if (currentGame === 'mixed') { box.innerHTML = `<strong>Spørgsmål:</strong> ${curObj.q}`; box.style.display = "block"; }

        document.getElementById('game-next').style.display = "block";
        speakCurrent();
    }

    function speakCurrent() {
        let txt = "";
        if (currentGame === 'words') txt = gAns ? curObj.full : curObj.d.replace("___", "");
        if (currentGame === 'numbers') txt = curObj.word;
        if (currentGame === 'articles') txt = gAns ? `${curObj.a} ${curObj.w}` : curObj.w;
        if (currentGame === 'time') txt = gAns ? `${curObj.qD} ... ${curObj.pfx}${curObj.ans}` : curObj.qD;
        if (currentGame === 'routine') txt = gAns ? `${curObj.d} ... ${curObj.a}` : curObj.d;
        if (currentGame === 'mixed') txt = gAns ? `${curObj.q} ... ${curObj.a}` : curObj.q;
        playAudio(txt);
    }
    
    // Numbers Generator Helpers
    function getNumWord(num) {
        if(num < 10) return units[num];
        if(num < 20) return teens[num-10];
        if(num === 100) return "hundrede";
        let u = num%10, t = Math.floor(num/10);
        return u === 0 ? tens[t] : units[u] + "og" + tens[t];
    }
    function getNumTip(num) {
        if(num < 10) return `<strong>${num}:</strong> Basic numbers 0-9.`;
        if(num < 20) return `<strong>${num}:</strong> Irregular 'teens'.`;
        if(num === 100) return `<strong>100:</strong> Et hundrede.`;
        let u = num%10, t = Math.floor(num/10);
        if(t < 5) return `<strong>${num}:</strong> Tens under 50 end in '-ve' or '-re'. (Ones digit always first).`;
        return `<strong>${num}:</strong> Base-20 counting system above 40.`;
    }
    function getQWordTip(w) {
        const t = {"Hvad":"What","Hvem":"Who","Hvorfor":"Why","Hvordan":"How","Hvor":"Where","Hvornår":"When","Hvilken(t)":"Which","Hvis":"Whose","Hvor + adjective":"How [much/fast/long]"};
        return `<strong>${w}</strong>: Translates to ${t[w] || ""}.`;
    }
</script>
